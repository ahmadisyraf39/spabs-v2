name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-and-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kuala_Lumpur
      HEADLESS: "true"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start the app with Docker Compose
        run: docker compose up -d --build

      - name: Wait until sample data is seeded
        run: |
          for i in $(seq 1 60); do
            if docker compose logs backend | grep -q "Seeded sample data"; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Backend was not ready after 5 minutes"
          docker compose logs backend
          exit 1

      - name: Run API tests
        working-directory: spabs-v2-autotests
        run: mvn -B test -DexcludedGroups=known-bugs -Dtest='**/api/*Tests'