name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-and-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kuala_Lumpur
      HEADLESS: "true"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start the app with Docker Compose
        run: docker compose up -d --build

      - name: Wait until sample data is seeded
        run: |
          for i in $(seq 1 60); do
            if docker compose logs backend | grep -q "Seeded sample data"; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Backend was not ready after 5 minutes"
          docker compose logs backend
          exit 1

      - name: Run API and UI tests
        working-directory: spabs-v2-autotests
        run: mvn -B test -DexcludedGroups=known-bugs

      - name: Save container logs
        if: always()
        run: docker compose logs > docker-logs.txt

      - name: Upload test reports, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            spabs-v2-autotests/target/surefire-reports/
            spabs-v2-autotests/target/screenshots/
            docker-logs.txt
          if-no-files-found: ignore

      - name: Stop the app
        if: always()
        run: docker compose down -v


  backend-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: spabs_v2
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run backend unit tests
        working-directory: spabs-v2-backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/spabs_v2
          DB_USERNAME: postgres
          DB_PASSWORD: test
          MAIL_HOST: localhost
          MAIL_PORT: "1025"
        run: mvn -B test